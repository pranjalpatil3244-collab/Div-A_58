<title>Employee Registration Form</title>

<body>
<div class="container">
<h2>Employee Registration</h2>

<form id="employeeForm">
<!-- Employee Name -->
<div class="form-group">
<label for="name">Employee Name</label>
<input type="text" id="name" placeholder="Enter employee name">
<span id="nameError" class="error"></span>
</div>
<!-- Email -->
<div class="form-group">
<label for="email">Email</label>
<input type="text" id="email" placeholder="Enter email address">
<span id="emailError" class="error"></span>
</div>
<!-- Password -->
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter password">
<span id="passwordError" class="error"></span>
</div>
<!-- Phone -->
<div class="form-group">
<label for="phone">Phone Number</label>
<input type="text" id="phone" placeholder="Enter 10-digit phone number">
<span id="phoneError" class="error"></span>
</div>
<!-- Department -->
<div class="form-group">
<label for="department">Department</label>
<select id="department">
<option value="">-- Select Department --</option>
<option value="HR">Human Resources</option>
<option value="IT">Information Technology</option>
<option value="Finance">Finance</option>
<option value="Marketing">Marketing</option>
<option value="Sales">Sales</option>
</select>
<span id="departmentError" class="error"></span>
</div>
<button type="submit">Register Employee</button>
<p id="successMessage" class="success"></p>
</form>
</div>
<script>
document.getElementById("employeeForm").addEventListener("submit", function(event) {

event.preventDefault();
// Get values
let name = document.getElementById("name").value.trim();
let email = document.getElementById("email").value.trim();
let password = document.getElementById("password").value;
let phone = document.getElementById("phone").value.trim();
let department = document.getElementById("department").value;
// Error elements
let nameError = document.getElementById("nameError");
let emailError = document.getElementById("emailError");
let passwordError = document.getElementById("passwordError");
let phoneError = document.getElementById("phoneError");
let departmentError = document.getElementById("departmentError");
let successMessage = document.getElementById("successMessage");
// Clear previous messages
nameError.textContent = "";
emailError.textContent = "";
passwordError.textContent = "";
phoneError.textContent = "";
departmentError.textContent = "";
successMessage.textContent = "";
let valid = true;
// Name validation
let namePattern = /^[A-Za-z ]{2,}$/;
if (name === "") {
nameError.textContent = "Name is required.";
valid = false;
}
else if (!namePattern.test(name)) {
nameError.textContent =
"Name must contain only letters and spaces and have at least 3 characters.";
valid = false;
}
// Email validation
let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (email === "") {
emailError.textContent = "Email is required.";
valid = false;
}
else if (!emailPattern.test(email)) {
emailError.textContent = "Enter a valid email address.";
valid = false;
}
// Password validation
let passwordPattern =
/^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

if (password === "") {
passwordError.textContent = "Password is required.";
valid = false;
}
else if (!passwordPattern.test(password)) {
passwordError.textContent =
"Password must contain at least 8 characters, one uppercase letter, one digit and one special
character.";
valid = false;
}
// Phone validation
let phonePattern = /^[6-9]\d{9}$/;
if (phone === "") {
phoneError.textContent = "Phone number is required.";
valid = false;
}
else if (!phonePattern.test(phone)) {
phoneError.textContent =
"Enter a valid 10-digit Indian mobile number.";
valid = false;
}
// Department validation
if (department === "") {
departmentError.textContent = "Please select a department.";
valid = false;
}
// Final result
if (valid) {
successMessage.textContent =
"Employee registered successfully!";
document.getElementById("employeeForm").reset();
}
});
</script>
</body>
</html>
